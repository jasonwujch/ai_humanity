宴游", "金石碑帖", "购藏书籍", "收租稻务", "家族事务", "赈务善举"], "snips": [{"date": "1921-03-07", "page": "114", "text": "昨舜臣南陵来书，孙子彬派拓碑人盛姓于廿二日到南，因大雪天寒，稍迟两日施工"}, {"date": "1921-03-15", "page": "116", "text": "吴舜臣来书，附寄各件：一、庚申年上下忙粮串票；一、东西城租簿二册；一、钱银总簿一册；一、叶家珀叶姚氏卖四都一图九甲土名、高塘叶房基契；此基因旧有房基，堪舆家云吉"}, {"date": "1921-03-17", "page": "117", "text": "覆陈劭吾、吴舜臣书"}]}, {"ym": "1921-04", "days": 4, "cats": ["社交宴游", "收租稻务", "购藏书籍", "金融实业", "赈务善举"], "snips": [{"date": "1921-04-11", "page": "122", "text": "吴舜臣汇来稻洋五百元"}, {"date": "1921-04-15", "page": "123", "text": "覆舜臣书，寄回赎刘传绪当契"}, {"date": "1921-04-18", "page": "124", "text": "覆吴舜臣书，钞寄峨岭潘胜友、黄昆山田契"}, {"date": "1921-04-28", "page": "126-127", "text": "覆吴舜臣书，并代黄子高购《辞源》，甲种，廿元，通例七折，十四元"}]}, {"ym": "1921-05", "days": 1, "cats": ["编纂著述", "收租稻务", "家族事务", "社交宴游"], "snips": [{"date": "1921-05-15", "page": "132", "text": "覆吴舜臣讯，前卖稻二百石，每二元六角六分"}]}, {"ym": "1921-06", "days": 3, "cats": ["社交宴游", "金石碑帖", "编纂著述", "收租稻务", "购藏书籍"], "snips": [{"date": "1921-06-06", "page": "139-140", "text": "吴舜臣汇来稻洋壹千元、内淑圆四百元"}, {"date": "1921-06-10", "page": "142", "text": "复吴舜臣书"}, {"date": "1921-06-22", "page": "146", "text": "昨接舜臣来书，志稿尚须迟一二月方可脱稿"}]}, {"ym": "1921-07", "days": 6, "cats": ["社交宴游", "购藏书籍", "金石碑帖", "医药疾病", "编纂著述", "收租稻务", "佛事宗教"], "snips": [{"date": "1921-07-02", "page": "149-150", "text": "致吴舜臣书"}, {"date": "1921-07-12", "page": "154", "text": "南陵吴舜臣汇来壹千元"}, {"date": "1921-07-14", "page": "154-155", "text": "致吴舜臣书，告光久来函述南通第七中学招考新生情形，原函亦附寄"}, {"date": "1921-07-22", "page": "156-157", "text": "覆舜臣书，并致冯光久，介绍南陵高等小学毕业生刘焕文、张振铎、戴庆云、刘义庆、吴卿保五人考入南通第七中学书"}, {"date": "1921-07-29", "page": "158-159", "text": "舜臣来函廿一日"}, {"date": "1921-07-30", "page": "159-160", "text": "吴舜臣汇来稻洋壹千元，内淑婉一百元，当付还淑婉"}]}, {"ym": "1921-08", "days": 7, "cats": ["社交宴游", "金融实业", "编纂著述", "收租稻务", "金石碑帖", "赈务善举", "购藏书籍", "政治时局", "医药疾病", "家族事务"], "snips": [{"date": "1921-08-01", "page": "161", "text": "致吴舜臣书"}, {"date": "1921-08-04", "page": "162-163", "text": "接吴舜臣廿八日南陵来书，南陵无雨，各佃均报灾，知事祷雨无灵，大约日内得雨尚有希望也"}, {"date": "1921-08-07", "page": "164", "text": "接舜臣六月卅日书，廿八晚得雨一寸多，真好雨也"}, {"date": "1921-08-10", "page": "165", "text": "舜臣初三日来书，初二晚间又得小雨"}, {"date": "1921-08-16", "page": "167-168", "text": "舜臣来书，望雨甚急，日内无雨，稻受大伤"}, {"date": "1921-08-18", "page": "168-169", "text": "覆舜臣书"}]}, {"ym": "1921-09", "days": 8, "cats": ["赈务善举", "收租稻务", "社交宴游", "编纂著述", "购藏书籍", "金石碑帖", "家族事务", "金融实业"], "snips": [{"date": "1921-09-01", "page": "173-174", "text": "舜臣廿六日来书，南陵日夜风雨，已割及在田之稻皆发芽，各佃纷纷来报请勘"}, {"date": "1921-09-04", "page": "174", "text": "致吴舜臣书"}, {"date": "1921-09-05", "page": "174-175", "text": "赠俞峻韵、吴舜臣《劝戒录类编》"}, {"date": "1921-09-10", "page": "176", "text": "舜臣初五日来书，南陵初三日始晴，昨、今至洋塘湖、四都汪、长塘坝、官塘冲等处查勘，系皆通芽稻，好坏略有不同"}, {"date": "1921-09-14", "page": "177-178", "text": "覆舜臣报灾书"}, {"date": "1921-09-15", "page": "178", "text": "覆吴舜臣书"}]}, {"ym": "1921-10", "days": 7, "cats": ["收租稻务", "社交宴游", "金石碑帖", "家族事务", "赈务善举", "佛事宗教", "购藏书籍", "金融实业", "医药疾病"], "snips": [{"date": "1921-10-06", "page": "188-189", "text": "至吴舜臣书"}, {"date": "1921-10-07", "page": "189", "text": "托子丹带《黄塘徐氏宗谱》交吴舜臣,又《保赤全书》带芜湖交翟展成"}, {"date": "1921-10-09", "page": "190", "text": "舜臣初六日来书，租稻已收二千四百余石，稻价三元一角，拟稍缓出售若干"}, {"date": "1921-10-11", "page": "191", "text": "覆吴舜臣书"}, {"date": "1921-10-15", "page": "193", "text": "函请舜臣转交"}, {"date": "1921-10-21", "page": "194-195", "text": "覆吴舜臣书"}]}, {"ym": "1921-11", "days": 6, "cats": ["社交宴游", "赈务善举", "医药疾病", "金融实业", "金石碑帖", "收租稻务", "家族事务", "购藏书籍", "佛事宗教", "编纂著述"], "snips": [{"date": "1921-11-08", "page": "200-201", "text": "吴舜臣九月廿四日来书；售稻一千石，每石三元二角三，先汇三千元（卅日收到），汇费十八元"}, {"date": "1921-11-17", "page": "204-205", "text": "舜臣来书，其夫人于十三日病故"}, {"date": "1921-11-18", "page": "205", "text": "覆吴舜臣书"}, {"date": "1921-11-22", "page": "207", "text": "致吴舜臣书"}, {"date": "1921-11-24", "page": "207", "text": "舜臣来书，二十日"}, {"date": "1921-11-26", "page": "208", "text": "吴舜臣来书，廿三日"}]}, {"ym": "1921-12", "days": 5, "cats": ["社交宴游", "赈务善举", "金石碑帖", "编纂著述", "收租稻务", "购藏书籍", "佛事宗教", "金融实业"], "snips": [{"date": "1921-12-03", "page": "211-213", "text": "致吴舜臣书，告俞峻韵交修志经费二千元"}, {"date": "1921-12-09", "page": "213-214", "text": "收吴舜臣汇来二千二百元"}, {"date": "1921-12-10", "page": "214", "text": "致吴舜臣函，详告在江浙皖振会为南陵乞振情形，并请俞峻韵报告，舜臣初六日来函，黄子猷义振协会会长初九日来函以后振务，函告黄子猷免生枝节"}, {"date": "1921-12-19", "page": "216", "text": "覆吴舜臣书"}, {"date": "1921-12-27", "page": "219-220", "text": "覆吴舜臣书"}]}, {"ym": "1922-01", "days": 4, "cats": ["赈务善举", "社交宴游", "金石碑帖", "收租稻务", "购藏书籍"], "snips": [{"date": "1922-01-07", "page": "223", "text": "舜臣来书，南陵益智义务学校募捐"}, {"date": "1922-01-12", "page": "224", "text": "覆吴舜臣书"}, {"date": "1922-01-16", "page": "225", "text": "函舜臣，江浙皖振会、安徽义振会各拨南陵振洋一千元"}, {"date": "1922-01-26", "page": "229-233", "text": "舜臣来书，湾村徐立孝等荒田一丘买成价卅元，另送徐立孝五元"}]}, {"ym": "1922-02", "days": 3, "cats": ["社交宴游", "医药疾病", "家族事务", "收租稻务", "金融实业", "金石碑帖", "赈务善举"], "snips": [{"date": "1922-02-20", "page": "241-242", "text": "至商务书馆，代吴舜臣买丙种四姨太太托"}, {"date": "1922-02-26", "page": "243-244", "text": "吴舜臣来函，寄来收支总簿、租簿契未税"}, {"date": "1922-02-27", "page": "244-245", "text": "覆吴舜臣书"}]}, {"ym": "1922-03", "days": 5, "cats": ["社交宴游", "政治时局", "购藏书籍", "金石碑帖", "编纂著述", "佛事宗教", "赈务善举", "金融实业", "收租稻务", "家族事务"], "snips": [{"date": "1922-03-03", "page": "246", "text": "覆吴舜臣书"}, {"date": "1922-03-08", "page": "248", "text": "覆吴舜臣书"}, {"date": "1922-03-16", "page": "254", "text": "致吴舜臣书,附寄致刘陆晓、黄子猷、俞峻韵函并安徽义振会覆县署义振协会公函"}, {"date": "1922-03-20", "page": "256-257", "text": "吴舜臣来函，十九日售出稻五百石，又淑记一百石，每石三元三角，现由德源汇洋一千九百八十元，月底兑交"}, {"date": "1922-03-27", "page": "259-260", "text": "吴舜臣汇来洋壹千九百八十元"}]}, {"ym": "1922-04", "days": 2, "cats": ["编纂著述", "政治时局", "收租稻务", "购藏书籍", "社交宴游"], "snips": [{"date": "1922-04-08", "page": "263-264", "text": "吴舜臣来函"}, {"date": "1922-04-17", "page": "266", "text": "子丹弟、吴舜臣来函，平巢壹千元已告刘陆晓到芜向翟展成接洽"}]}, {"ym": "1922-05", "days": 3, "cats": ["赈务善举", "购藏书籍", "社交宴游", "家族事务", "医药疾病", "政治时局"], "snips": [{"date": "1922-05-08", "page": "273", "text": "致吴舜臣书,覆大太太、子丹弟、冠英侄书"}, {"date": "1922-05-09", "page": "273", "text": "致吴舜臣书"}, {"date": "1922-05-11", "page": "273-274", "text": "致吴舜臣书"}]}, {"ym": "1922-06", "days": 4, "cats": ["政治时局", "收租稻务", "家族事务", "社交宴游", "佛事宗教", "购藏书籍", "金石碑帖", "金融实业", "编纂著述"], "snips": [{"date": "1922-06-01", "page": "280", "text": "覆吴舜臣书"}, {"date": "1922-06-08", "page": "283", "text": "寄吴舜臣《周安士全书》"}, {"date": "1922-06-10", "page": "284", "text": "覆吴舜臣书"}, {"date": "1922-06-17", "page": "286", "text": "覆吴舜臣书"}]}, {"ym": "1922-07", "days": 13, "cats": ["赈务善举", "社交宴游", "政治时局", "购藏书籍", "编纂著述", "金融实业", "收租稻务", "金石碑帖", "医药疾病", "佛事宗教", "家族事务"], "snips": [{"date": "1922-07-08", "page": "290-291", "text": "舜臣来函，亦云水灾，大略相同"}, {"date": "1922-07-10", "page": "291-292", "text": "舜臣十三日来书，述水灾至重至惨"}, {"date": "1922-07-11", "page": "292", "text": "补初六日覆舜臣书"}, {"date": "1922-07-13", "page": "293", "text": "覆南陵县知事徐磊生函，捐助壹千元办急振，并附安徽义振会代元电告筹振情形，寄吴舜臣转交，请代筹借壹千元"}, {"date": "1922-07-14", "page": "293-294", "text": "覆义振协会、农会、教育会、劝学所、商会、地方财政局代元电告，自捐壹千元交县署办急振，并振会连日筹办情形，寄吴舜臣转交"}, {"date": "1922-07-17", "page": "295-296", "text": "舜臣来函，芜湖、宣南蛟灾，急振会派凤、朱二君携洋壹千元查放急振，省长义款二千元，本城募集约三千元，助振各户均主放急振，不愿工振"}]}, {"ym": "1922-08", "days": 8, "cats": ["社交宴游", "赈务善举", "金石碑帖", "金融实业", "佛事宗教", "收租稻务", "家族事务"], "snips": [{"date": "1922-08-03", "page": "304", "text": "覆吴舜臣书"}, {"date": "1922-08-06", "page": "305", "text": "徐磊生、吴舜臣均函告，初七、初八两日南陵得雨一寸"}, {"date": "1922-08-07", "page": "305-306", "text": "覆吴舜臣书"}, {"date": "1922-08-11", "page": "307", "text": "覆吴舜臣书"}, {"date": "1922-08-15", "page": "307-308", "text": "覆吴舜臣书"}, {"date": "1922-08-18", "page": "308-309", "text": "覆吳舜臣書"}]}, {"ym": "1922-09", "days": 6, "cats": ["赈务善举", "收租稻务", "社交宴游", "金石碑帖", "购藏书籍", "医药疾病", "金融实业", "政治时局"], "snips": [{"date": "1922-09-08", "page": "317-318", "text": "覆吴舜臣书"}, {"date": "1922-09-12", "page": "318-319", "text": "覆吴舜臣书"}, {"date": "1922-09-14", "page": "319", "text": "致书吴舜臣"}, {"date": "1922-09-16", "page": "319-320", "text": "函舜臣，寄代购水龙番布式拾码，计洋式拾玖元，又铁箱一元"}, {"date": "1922-09-21", "page": "320-321", "text": "覆吴舜臣函"}, {"date": "1922-09-27", "page": "322-323", "text": "覆吴舜臣书"}]}, {"ym": "1922-10", "days": 4, "cats": ["社交宴游", "收租稻务", "赈务善举", "政治时局", "金石碑帖", "金融实业", "家族事务"], "snips": [{"date": "1922-10-07", "page": "326-327", "text": "覆吴舜臣书"}, {"date": "1922-10-13", "page": "328", "text": "覆吴舜臣书"}, {"date": "1922-10-17", "page": "329", "text": "覆吴舜臣书"}, {"date": "1922-10-25", "page": "331", "text": "覆吴舜臣书"}]}, {"ym": "1922-11", "days": 5, "cats": ["社交宴游", "收租稻务", "金石碑帖", "购藏书籍", "金融实业", "医药疾病", "政治时局", "家族事务", "赈务善举"], "snips": [{"date": "1922-11-01", "page": "332-333", "text": "一收吴舜臣南陵租稻壹千元；淑记借三百元，余存家用"}, {"date": "1922-11-02", "page": "333", "text": "资生厂转南陵吴舜臣书"}, {"date": "1922-11-04", "page": "333-334", "text": "覆吴舜臣书"}, {"date": "1922-11-05", "page": "334-335", "text": "覆吴舜臣书"}, {"date": "1922-11-25", "page": "348-349", "text": "覆南陵吴舜臣书"}]}, {"ym": "1922-12", "days": 11, "cats": ["社交宴游", "收租稻务", "购藏书籍", "赈务善举", "政治时局", "金石碑帖", "金融实业", "医药疾病", "编纂著述", "佛事宗教", "家族事务"], "snips": [{"date": "1922-12-05", "page": "351", "text": "覆吴舜臣书"}, {"date": "1922-12-06", "page": "351-353", "text": "致吴舜臣书"}, {"date": "1922-12-07", "page": "356-357", "text": "吴舜臣来函，徐磊生至省，劝办储谷及社仓，照会各大堂子、各大族公堂及各业户执业粮田，每亩储谷二升，次年筹设仓厰，赓续增储"}, {"date": "1922-12-10", "page": "359", "text": "夏玉峰来，交展成来函，舜臣稻洋四千元已收，商在汇芜振款内扣拨"}, {"date": "1922-12-12", "page": "360-361", "text": "磊生并云舜臣是否函告，答以函中言及，亦甚简略，磊生遂不言，即捐积谷事亦不言"}, {"date": "1922-12-14", "page": "361", "text": "致吴舜臣书"}]}, {"ym": "1923-01", "days": 7, "cats": ["金石碑帖", "社交宴游", "购藏书籍", "收租稻务", "编纂著述", "佛事宗教", "政治时局", "赈务善举"], "snips": [{"date": "1923-01-03", "page": "372-373", "text": "覆吴舜臣书"}, {"date": "1923-01-14", "page": "376", "text": "胡子贵、杨文卿来沪，交舜臣函，西区二三四号因火警公捐三百，赴沪购办新洋龙，属为绍介，款如不敷，在百元以内暂行借垫"}, {"date": "1923-01-20", "page": "378", "text": "昨舜臣来函亦言"}, {"date": "1923-01-21", "page": "378", "text": "又寄赠吴舜臣哗吼袍料、汤壶"}, {"date": "1923-01-24", "page": "380", "text": "覆吴舜臣书"}, {"date": "1923-01-27", "page": "381", "text": "吴舜臣汇来稻价一千三百元"}]}, {"ym": "1923-02", "days": 3, "cats": ["政治时局", "金石碑帖",
