: "修志", "phase": "礼聘·受任", "principals": ["牧子襄", "陈海汇", "吴舜臣"], "snippet": "复南陵修志馆同人书，牧子壤、陈海汇书，吴舜臣书，论修志事。辞纂修并束脩。  晚，同汪书"}, {"date": "1920-08-25", "page": "62", "kw": "县志", "phase": "礼聘·受任", "principals": [], "snippet": "甫先生，商延李元之君修《南陵县志》事。一束脩月四十元，期定一年；二协修名义，兼分纂人物志。  同孙益庵略谭，"}, {"date": "1920-08-27", "page": "62-63", "kw": "修志", "phase": "纂修·采访", "principals": ["吴舜臣"], "snippet": "情形，主持出售。随《时报》告修志另请李元之君为协纂，或协修。兼分纂人物志，月修四十元，如同意，拟约其八月杪同"}, {"date": "1920-08-31", "page": "64", "kw": "县志", "phase": "纂修·采访", "principals": [], "snippet": "娘两志拓本交还。  辑《南陵县志》艺文志南陵人诗四十三家，参考人物各志。录目，待编《安徽诗征》。  丁辅之来"}, {"date": "1920-09-08", "page": "65-66", "kw": "县志", "phase": "志事往来", "principals": ["吴舜臣"], "snippet": "下忙。李元之不就修  《南陵县志》。  致东台陈寿盒书。询陈墨遂昆仲并陈祺寿君。  夏辅宜来谭。"}, {"date": "1920-09-17", "page": "68", "kw": "县志", "phase": "礼聘·受任", "principals": [], "snippet": "盒书，请代约陈星南就南陵协修县志并分纂人物志，月送束脩四十元，期以一年，川资酌送。又询敬遂课读兼一笔墨事，年"}, {"date": "1920-10-17", "page": "77", "kw": "修志", "phase": "志事往来", "principals": [], "snippet": "至县署，拜刘陆晓。又至修志局，拜局董并编。拜各亲友。  胡鋪坤送菜点。"}, {"date": "1920-10-18", "page": "77-78", "kw": "修志", "phase": "志事往来", "principals": [], "snippet": "氏家，又至叶家珀。  晚，赴修志局酒叙之约。"}, {"date": "1920-10-19", "page": "78", "kw": "县志", "phase": "志事往来", "principals": ["牧子襄"], "snippet": "谈修志事并交商榷书。留《仪征县志》。"}, {"date": "1920-12-20", "page": "95", "kw": "修志", "phase": "志事往来", "principals": ["吴舜臣"], "snippet": "《简斋外集》一册。吴舜臣书。修志局事、选举事。"}, {"date": "1921-01-04", "page": "98", "kw": "修志", "phase": "纂修·采访", "principals": ["吴舜臣"], "snippet": "十元。当交颂清。  南陵筹备修志局来书，催聘协修，薪金多寡属主持。又云约明春回里，又访碑三十三种。  舜臣来"}, {"date": "1921-01-13", "page": "100", "kw": "修志", "phase": "志事往来", "principals": [], "snippet": "颂清来。  覆南陵县筹备修志局书。"}, {"date": "1921-02-01", "page": "105-106", "kw": "修志", "phase": "志事往来", "principals": ["吴舜臣"], "snippet": "覆舜臣函。修志事志局董事会议用前函弟一条，不另聘协修，稿成寄沪，如在沪请人，薪水亦归志局。"}, {"date": "1921-03-07", "page": "114", "kw": "拓碑", "phase": "纂修·采访", "principals": ["孙子彬", "吴舜臣"], "snippet": "昨舜臣南陵来书，孙子彬派拓碑人盛姓于廿二日到南，因大雪天寒，稍迟两日施工。"}, {"date": "1921-07-02", "page": "149-150", "kw": "修志", "phase": "纂修·采访", "principals": ["吴舜臣"], "snippet": "氏仙屏书屋活字本毕。  南陵修志局来书，云志馆编辑脱稿尚无定期，其已成之门类现正由司书生眷写，并寄来新拓各碑"}, {"date": "1921-08-26", "page": "171", "kw": "县志", "phase": "纂修·采访", "principals": ["吴舜臣"], "snippet": "歉收。公民团反对初选人贿赂。县志稿秋节后可成。湾村水程寄还。  覆方德斋书。论选举失败。  覆刘翰怡书。八月"}, {"date": "1921-09-01", "page": "173-174", "kw": "县志", "phase": "志事往来", "principals": ["吴舜臣"], "snippet": "前寄先光禄公史传案牍已照录寄县志局，其关涉淮事别送省志局，节略再钞稿寄阅。由扬州督办江苏运河工程局来。  李"}, {"date": "1921-09-15", "page": "178", "kw": "县志", "phase": "志事往来", "principals": ["盛彝斋", "杨芷青", "吴舜臣"], "snippet": "覆盛彝斋书。论李勇恪公应入县志流寓传,寄《亚洲学术杂志》。  覆杨芷青书。论南陵水灾乞振情形,寄芷青、峻韵"}, {"date": "1921-11-24", "page": "207", "kw": "志稿", "phase": "纂修·采访", "principals": ["吴舜臣"], "snippet": "二角。租稻已收至三千六百石，志稿月初派人送沪。  至仁济堂，戒安、宋廷、幼南先后至。  同戒安商将红十字会捐"}, {"date": "1922-01-24", "page": "228", "kw": "修志", "phase": "志事往来", "principals": [], "snippet": "壹千元，南陵稻价四千元，南陵修志馆存式千元。用随盒长方牙章。  柳梓庭代换交易纱布所股票，并付息陆拾元。合四"}, {"date": "1922-06-12", "page": "284", "kw": "县志", "phase": "志事往来", "principals": [], "snippet": "晤陈乃乾，知乃乾来交还《南陵县志》稿。  至忠厚书庄，取书五种，价八元：《兰皋明词汇选》八卷，顾璟芳等撰，康"}, {"date": "1922-06-17", "page": "286", "kw": "志书", "phase": "志事往来", "principals": ["牧子襄", "盛彝斋", "吴舜臣"], "snippet": "。洋龙番布管托子丹买。  致志书局、盛彝斋、牧子襄书。  晚十时，登大顺轮至通。"}, {"date": "1922-07-12", "page": "292-293", "kw": "县志", "phase": "纂修·采访", "principals": ["陈海汇"], "snippet": "办现定经籍、艺文志。并交原本县志艺文二册，又碑碣拓本至明止，又新编金石志稿一册。  陈立炎假明刻《授经图》二"}, {"date": "1922-07-17", "page": "295-296", "kw": "志书", "phase": "志事往来", "principals": ["盛彝斋", "吴舜臣"], "snippet": "峻韵。  盛彝斋来函，答复询志书各条，并寄盛此公《休庵影语》、可憐娘沈孺人墓碑、柔娘墓碑、刘乙亭《多憾集序》"}, {"date": "1922-07-26", "page": "301", "kw": "县志", "phase": "志事往来", "principals": ["吴舜臣"], "snippet": "堂。取回旧浅雕扇骨，印《南陵县志》格一千张，陈绍清水冷金笺(六尺，三元)。"}, {"date": "1922-07-29", "page": "302-303", "kw": "县志", "phase": "刊印·校样", "principals": [], "snippet": "局排印一千册。又以新印《南陵县志》格纸三百叶交乃乾，债人录《南陵经籍》《金石》两志稿。  至仁济堂，晤戒安、"}, {"date": "1922-07-31", "page": "303-304", "kw": "访碑", "phase": "纂修·采访", "principals": ["盛彝斋", "吴舜臣"], "snippet": "覆吴舜臣书。振务、拓碑、访碑，告沪会一万元今日已汇。省长放振各款。  覆盛彝斋书。一振务，一志书金石。"}, {"date": "1922-08-11", "page": "307", "kw": "拓碑", "phase": "纂修·采访", "principals": ["吴舜臣"], "snippet": "论工振情形。  覆吴舜臣书。拓碑事。  发家书。收到十五日寄水泥公司股东会各件。  致李拔可书。寄水泥公司委"}, {"date": "1922-08-30", "page": "312-313", "kw": "访碑", "phase": "纂修·采访", "principals": ["杨芷青", "吴舜臣"], "snippet": "又托陈石庐。  致杨芷青书。访碑、拓碑。  致陈乃乾书。询南洋甲种商业学校情形(卡德路山海关路二号)。  致"}, {"date": "1922-09-12", "page": "318-319", "kw": "拓碑", "phase": "纂修·采访", "principals": ["杨芷青", "吴舜臣"], "snippet": "田三亩五分，约每亩卅五六元。拓碑水退后再拓，杨芷青来函同。青弋江灾民一千余人抢米。  覆王雪澄书。雪澄托觅新"}, {"date": "1922-10-13", "page": "328", "kw": "访碑", "phase": "纂修·采访", "principals": ["杨芷青", "吴舜臣"], "snippet": "户口并各家诗集、节妇及地名，访碑、拓碑。  覆吴舜臣书。金库券南陵六千元，县自认一千元。稻价每石三元，出售千"}, {"date": "1922-11-23", "page": "346-348", "kw": "访碑", "phase": "纂修·采访", "principals": [], "snippet": "... ① 开元六年十月。《访碑》系仁和赵氏藏本，《缪目》在山西虞乡。此碑有阳城张氏考藏长方碑，又顾千里立长"}, {"date": "1922-12-12", "page": "360-361", "kw": "志书", "phase": "志事往来", "principals": ["吴舜臣"], "snippet": "云及我亦有意修理，并商磊生将志书钱款抵用，答以须同志局同人会议。  吴舜臣交展成划汇稻款四千元，今收到玉峰交"}, {"date": "1922-12-16", "page": "362", "kw": "县志", "phase": "礼聘·受任", "principals": [], "snippet": "，光绪十一年刻本。《武进阳湖县志》卅一卷。汤成烈总纂，光绪己卯重修本。"}, {"date": "1923-01-03", "page": "372-373", "kw": "访碑", "phase": "纂修·采访", "principals": ["吴舜臣"], "snippet": "。  致庞莱臣书。请绘《摄山访碑图》卷。  李拔可来书。售书款壹百柒拾二元三角。  陈乃乾来，商订《南陵金石"}, {"date": "1923-01-07", "page": "373-374", "kw": "县志", "phase": "礼聘·受任", "principals": [], "snippet": "角。两丛书、竹纸各二。《山阳县志》，三二角，一。合洋六十元○角，同来青阁换志书、《五百名贤像》：《续纂庐州府"}, {"date": "1923-01-12", "page": "375-376", "kw": "县志", "phase": "纂修·采访", "principals": [], "snippet": "价洋陆元：廿八日付讫。《太和县志》八卷，  頁數T C 年製。《风阳县志》十六卷。光绪十三年知县谢永泰重修。"}, {"date": "1923-01-14", "page": "376", "kw": "县志", "phase": "礼聘·受任", "principals": ["盛彝斋", "吴舜臣"], "snippet": "角：十二月初四日付讫。《丹徒县志》六卷，吕耀斗总纂，价五元，光绪五年刻。《金山姚氏二先生集》。姚前枢江林禽馆"}, {"date": "1923-01-24", "page": "380", "kw": "县志", "phase": "纂修·采访", "principals": ["吴舜臣"], "snippet": "米。  致翟展成书。代购《泾县志》十二卷，钱人麟纂修，乾隆癸酉刻本。每叶皆铃县印，价十二元，钱昌美出售，托夏"}, {"date": "1923-02-04", "page": "383", "kw": "修志", "phase": "纂修·采访", "principals": ["吴舜臣"], "snippet": "礼有加，曷胜荣幸。  覆南陵修志馆书。收三次拓碑九种。  覆吴舜臣书。舜臣告南陵财政情形。新任雷知事禁米出境"}, {"date": "1923-02-11", "page": "386-387", "kw": "访碑", "phase": "纂修·采访", "principals": [], "snippet": "题。  访余尧衢谭，留《定林访碑图》卷乞题，并赠宣纸《徐公文集》。又木匣，癸亥三月廿六日题成交还。  答拜许"}, {"date": "1923-03-19", "page": "397", "kw": "县志", "phase": "纂修·采访", "principals": [], "snippet": "李拔可，假《赖古堂集》《宣城县志》。  刘谦甫来谭。  陈乃乾来，编《南陵艺文志》。"}, {"date": "1923-03-22", "page": "398", "kw": "分纂", "phase": "礼聘·受任", "principals": [], "snippet": "句容志、五河志、芜湖志。交其分纂。  覆陈劭吾书。寄来大有晋存款折据并寄尘书已转交，另由寄尘函复。《正谊堂全"}, {"date": "1923-04-04", "page": "402-403", "kw": "县志", "phase": "志事往来", "principals": [], "snippet": "青阁，付《正谊堂全书》《甘泉县志》价洋四十元。又购书三种，实洋四元八角六分：又假王定安《湘军记》、王暐《兰言"}, {"date": "1923-04-14", "page": "405-406", "kw": "县志", "phase": "刊印·校样", "principals": ["盛彝斋", "吴舜臣"], "snippet": "致翟展成书。询去年寄乾隆《泾县志今正》《白话劝孝文》是否收到。托购宣城等县志及太平茶二斤。  致陶子麟书。催"}, {"date": "1923-07-19", "page": "439", "kw": "县志", "phase": "志事往来", "principals": ["盛彝斋", "吴舜臣"], "snippet": "覆盛彝斋书。叶耀卿先生是否县志懿行，叶鸿纶之子。马正英请书已发。赠联。薄海文章。欧永叔中原儒雅斛斯征。修志"}, {"date": "1923-07-25", "page": "440-441", "kw": "县志", "phase": "志事往来", "principals": ["吴舜臣"], "snippet": "陈姓李紫东荐。钞书洋五元。《县志》九千二百〇九字，《诗征》一万四千八百七十二字。  致赵椒圃书。荐赵幼南。椒"}, {"date": "1923-09-09", "page": "454", "kw": "志稿", "phase": "纂修·采访", "principals": ["吴舜臣"], "snippet": "，收到南陵杂税单，内烟酒税新志稿云光绪卅年以筹办练兵经费征税，今单云光绪廿四年奉文起征，请覆核，并请地丁户口"}, {"date": "1923-10-02", "page": "464", "kw": "志稿", "phase": "纂修·采访", "principals": [], "snippet": "还《南陵金石、经籍、艺文》三志稿。"}, {"date": "1923-10-29", "page": "474-475", "kw": "县志", "phase": "纂修·采访", "principals": [], "snippet": "》。  张菊生来书，代购安徽县志一种。覆书谢之，附缴价四元：《续修舒城县志》五十卷。光绪丁未仲冬修本。  吴"}, {"date": "1923-12-17", "page": "492", "kw": "县志", "phase": "志事往来", "principals": ["吴舜臣"], "snippet": "告之。  刘次羽来，交《南陵县志》稿。学校、武备、营建，共四册。  晚至荣德均镶牙。  购钱昌美宋蜀本沈约《"}, {"date": "1924-08-01", "page": "559", "kw": "县志", "phase": "志事往来", "principals": [], "snippet": "、佑两儿游大世界。  《南陵县志》稿近日编成。  昨南陵汇来稻洋捌百元,即存先施公司。"}, {"date": "1924-08-18", "page": "564", "kw": "志稿", "phase": "纂修·采访", "principals": ["吴舜臣"], "snippet": "覆秦兰帆、章斐然书。查询志稿半泳陂。  覆吴舜臣书。询三太太到南陵否。附寄秦、章函。  晚至蟬隐庐，晤罗"}, {"date": "1924-08-26", "page": "566-567", "kw": "志书", "phase": "纂修·采访", "principals": ["吴舜臣"], "snippet": "遵王藏本欵？  覆吴舜臣书。志书已成，现无人送，南陵人来取最好，请询示。江浙皖恐有兵事，租收仓，得价即卖，随"}, {"date": "1924-09-02", "page": "568", "kw": "志书", "phase": "志事往来", "principals": ["吴舜臣"], "snippet": "亩,峨岭尚未查勘也。  又云志书各董均在乡区农忙,俟节后我处无人送,南陵再派人来取。  付大生来往折洋式百元"}, {"date": "1924-10-12", "page": "578", "kw": "县志", "phase": "志事往来", "principals": [], "snippet": "寄翁书《金刚经》，并询《建德县志》出售处。  致陈倬喬、萧子文书。寄翁书《金刚经》。  晚挈崇儿至来青阁、忠"}, {"date": "1924-12-28", "page": "600", "kw": "县志", "phase": "志事往来", "principals": ["杨芷青"], "snippet": "桂云阶超群。由南陵来，取新修县志薄。暮答拜，邀至新世界西餐。  郑苏龛、刘慧之、刘公鲁来谭。  李振亚来，商"}, {"date": "1924-12-30", "page": "600-601", "kw": "县志", "phase": "分发·结账", "principals": ["吴舜臣"], "snippet": "约芷青、云阶午饭，交新修县志稿五十卷、廿四册。来稿、卅八册。旧志、十二册。各家集稿、五册。采访册、一"}, {"date": "1925-02-09", "page": "729", "kw": "县志", "phase": "志事往来", "principals": [], "snippet": "羽校书洋十元,又代送校《南陵县志》洋壹百元。原议校全书共二百元。  覆汪鲁门书。覆运商捐振情形。寄《法华经》"}, {"date": "1925-02-17", "page": "613", "kw": "县志", "phase": "礼聘·受任", "principals": [], "snippet": "陈乃乾赠雍正丙午修《南陵县志》，宋廷佐主修，汪越、沈廷璐、陶性编纂。凡十六卷。缺卷六公署、学校、祠祀、古"}, {"date": "1925-03-01", "page": "617", "kw": "县志", "phase": "纂修·采访", "principals": [], "snippet": "安徽诗征》稿，拟再补入《南陵县志·艺文稿》。"}, {"date": "1925-03-10", "page": "620-621", "kw": "修志", "phase": "志事往来", "principals": ["吴舜臣"], "snippet": "我处转，催各房未必有效。  修志事总算交代清楚，现志局存洋约一千元，未收五千元，三月二十日开局收款，志定价每"}, {"date": "1925-03-17", "page": "622-623", "kw": "修志", "phase": "纂修·采访", "principals": [], "snippet": "女新华书画遗墨索题。  南陵修志馆来书，初十日开会，志稿余洋均照收，并开议案十一条。  任子木来谭，约往李伟"}, {"date": "1925-07-11", "page": "661", "kw": "修志", "phase": "刊印·校样", "principals": ["吴舜臣"], "snippet": "稿件请举人负责。  覆南陵县修志馆书。询时局不靖，志书能否付印，覆沪市已开，可请人来经理接洽印局议价。  覆"}, {"date": "1925-11-24", "page": "705", "kw": "县志", "phase": "刊印·校样", "principals": ["杨芷青"], "snippet": "，随往访，略谭。此来系专请印县志，当辞谢帮忙，须另举人负责。午后，约至商务书馆，看印成书样，金以新印《淮南鸿"}, {"date": "1925-11-25", "page": "705", "kw": "县志", "phase": "刊印·校样", "principals": ["杨芷青"], "snippet": "、杨芷青、刘达章来，交《南陵县志》稿。同至商务书馆，商询排印工价，估每页排工实洋一元。未结果，晤拔可、心白，"}, {"date": "1925-11-26", "page": "705-706", "kw": "县志", "phase": "刊印·校样", "principals": ["杨芷青"], "snippet": "。  沈骏声来谈，拟印《南陵县志》，略阅稿本。  同峻韵、芷青、达章至大东印书局，商印志书价值及期限。印大字"}, {"date": "1925-11-29", "page": "707-708", "kw": "县志", "phase": "纂修·采访", "principals": ["杨芷青", "吴舜臣"], "snippet": "国书店，同大东书局沈骏声签印县志合同，随骏声约至晋隆西餐。县志局代表俞峻韵、杨芷青、刘达章及余四人签字。"}, {"date": "1925-11-30", "page": "708-709", "kw": "县志", "phase": "志事往来", "principals": ["杨芷青", "吴舜臣"], "snippet": "洋六角。  约刘次羽来,商校县志。送洋二百元。"}, {"date": "1925-12-11", "page": "712", "kw": "县志", "phase": "纂修·采访", "principals": ["杨芷青", "吴舜臣"], "snippet": "中国书店，晤陈乃乾，交《南陵县志》稿共六册：《艺文志》三卷、二册。《金石志》四卷。二册，又旧稿二册。  至来"}, {"date": "1925-12-25", "page": "715", "kw": "修志", "phase": "志事往来", "principals": [], "snippet": "子鹤之夫人绸幢、烛。  南陵修志馆汇来洋式千元。"}, {"date": "1925-12-28", "page": "716", "kw": "修志", "phase": "志事往来", "principals": [], "snippet": "元，还花园巷押租。  存南陵修志馆洋式千元在中国实业银行。  刘健之来谭。  访鲍承良，不遇。  致江汉珊省"}, {"date": "1926-01-05", "page": "718-719", "kw": "修志", "phase": "纂修·采访", "principals": [], "snippet": "值会。  至中国实业银行，取修志馆一千两付纸价。  访峻韵，同至文成隆记，定立文育盖加二百，议单先付元一千两"}, {"date": "1926-01-22", "page": "723-724", "kw": "修志", "phase": "志事往来", "principals": ["吴舜臣"], "snippet": "收到南陵修志馆汇来二千元，当存实业  银行。  覆缪子受书。来书云有宋本《楼攻愧集》《唐"}, {"date": "1926-04-06", "page": "744", "kw": "县志", "phase": "纂修·采访", "principals": [], "snippet": "形。  至大东书局，交《南陵县志》列女志稿三册六卷，又地图二张。附补画青阳等交界地名草图。  至中国书店，晤"}, {"date": "1926-05-15", "page": "755-756", "kw": "县志", "phase": "志事往来", "principals": [], "snippet": "声嘉金，绍兴。书。催印《南陵县志》。  以蓝印本《宋元科举三录》赠杨寿祺，覆赠《宋元旧本经眼录》三部。  致"}, {"date": "1926-06-06", "page": "763", "kw": "县志", "phase": "志事往来", "principals": ["吴舜臣"], "snippet": "。  至大东书局，催印《南陵县志》。  晚，周业勤、行广。吴德增。约便饭，朱古微、江孝潜同席。  覆朱遂翔书"}, {"date": "1926-06-30", "page": "770", "kw": "县志", "phase": "纂修·采访", "principals": ["吴舜臣"], "snippet": "算。  至大东书局，交《南陵县志·舆地志》稿七卷。  至汉文渊，购付洋五元。后晋复溪州铜柱记，四面刻（缪目作"}, {"date": "1926-07-11", "page": "773", "kw": "修志", "phase": "志事往来", "principals": ["杨芷青"], "snippet": "扶病往慰。  南陵杨芷青汇来修志经费壹千元，交吴元松存蒙藏银行半年。周息六厘，阳历七月十一日存，阴历十二月初"}, {"date": "1926-07-28", "page": "776", "kw": "修志", "phase": "志事往来", "principals": [], "snippet": "南陵修志馆汇来洋式千元，当存中国实业银行。  覆翟展成书。来函并《皖江日报》交少舟阅"}, {"date": "1926-08-09", "page": "782-783", "kw": "访碑", "phase": "刊印·校样", "principals": ["盛彝斋", "杨芷青", "吴舜臣"], "snippet": "钞附。宋石龙庵记在廿六七都请访碑拓文。宣城放四千元、南陵四千五百元、芜湖二千元。  覆盛彝斋书。告放振情形，"}, {"date": "1926-08-21", "page": "786", "kw": "县志", "phase": "纂修·采访", "principals": [], "snippet": "书局，晤沈骏声，商定保《南陵县志稿》险五千两，一年期，在先施公司保，付保费二十五两。  覆那铁珊书。退还鼻烟"}, {"date": "1926-08-30", "page": "788-789", "kw": "县志", "phase": "纂修·采访", "principals": [], "snippet": "三号中间及右厢楼上下内《南陵县志稿》。保单、收条各一件,总理盛恩颐、协理厉汝然、主任洪国桢,第五四七七号保单"}, {"date": "1926-10-29", "page": "806", "kw": "县志", "phase": "志事往来", "principals": [], "snippet": "戴春记、束义记议定装订《南陵县志》，每万纸二元一角，苏线每本四厘。十一月廿六日退束义记，并戴春记装订。  汪"}, {"date": "1926-11-13", "page": "810", "kw": "县志", "phase": "志事往来", "principals": [], "snippet": "付夏生记做《南陵县志》毛边古书面七十刀，每刀一百张价洋二元八角。价洋一百九十六元。"}, {"date": "1926-11-18", "page": "811", "kw": "县志", "phase": "志事往来", "principals": ["吴舜臣"], "snippet": "放急振，现各振有难兼顾情形。县志印成再呈。  覆吴舜臣书。告同庄得之接洽立红十字会分会事，寄会章全分，来信云"}, {"date": "1926-11-20", "page": "811-812", "kw": "县志", "phase": "纂修·采访", "principals": ["杨芷青"], "snippet": "。  覆张祝秋书。请书《南陵县志》书衣。"}, {"date": "1926-12-03", "page": "816", "kw": "县志", "phase": "志事往来", "principals": [], "snippet": "亦不遇。朱云青来谭,付《南陵县志》订作保险费十五两。付洋二十元。"}, {"date": "1926-12-18", "page": "820-821", "kw": "修志", "phase": "志事往来", "principals": ["杨芷青"], "snippet": "款题名亦正催欠户交清编次，又修志题名不必用余咏南鉴定名称。  大生纱厂来函，十一月初八日一厂开股东会，改选董"}, {"date": "1926-12-20", "page": "821", "kw": "县志", "phase": "纂修·采访", "principals": ["吴舜臣"], "snippet": "至大东书局，交南陵舆图并县志书衣。  至红十字会，查南陵分会寄来函、洋，收到。  访任子木谭。  傅尧生"}, {"date": "1926-12-30", "page": "824-825", "kw": "县志", "phase": "志事往来", "principals": ["吴舜臣"], "snippet": "不按批至大东书局取新印《南陵县志》，取消前定合同，改归戴春记一家装订。  晚，至受古书店，购廿七日付讫。《祁"}, {"date": "1927-02-14", "page": "840", "kw": "县志", "phase": "志事往来", "principals": ["杨芷青", "吴舜臣"], "snippet": "。  覆俞峻韵、杨芷青书。告县志月内可成，二月运南。  致吴舜臣书。附致俞杨书。  吴东迈来谭，交还缶老假阅"}, {"date": "1927-04-17", "page": "859-860", "kw": "县志", "phase": "纂修·采访", "principals": [], "snippet": "谭。  覆刘翰怡书。赠《南陵县志》。  覆陈子言书。谢赠新著《庐州诗苑》，借《诗萃》十二册。覆赠竹纸印《宋元"}, {"date": "1927-05-10", "page": "866", "kw": "访碑", "phase": "刊印·校样", "principals": ["杨芷青", "吴舜臣"], "snippet": "读《嵩洛访碑日记》，黄易。记得汉镜二段：  市间得汉镜，文曰“宜君乐，乐未央，大富昌”。"}, {"date": "1927-05-25", "page": "873-874", "kw": "县志", "phase": "分发·结账", "principals": ["杨芷青", "吴舜臣"], "snippet": "、杨芷青、刘达章书。开列经用县志帐单，收洋八千○五十五元八角一分，支洋七千二百八十六元二角，净存七百六十九元"}, {"date": "1927-06-21", "page": "881", "kw": "县志", "phase": "纂修·采访", "principals": ["杨芷青", "吴舜臣"], "snippet": "。来函辞加薪请，仍照支。催交县志款。十五日，南陵得雨。筹备自治会七区，每区一人。城区举刘显章(达章之四弟)，"}, {"date": "1927-06-28", "page": "883-884", "kw": "县志", "phase": "礼聘·受任", "principals": [], "snippet": "谭。  致陈乃乾书。赠《南陵县志》。  致沈骏声书。赠《南陵县志》。  高吹万燮，金山县修志总纂，金山人，住"}, {"date": "1927-06-29", "page": "884", "kw": "县志", "phase": "志事往来", "principals": [], "snippet": "当为绍介。  赠李元之《南陵县志》。  报载，是日天气阴云往复，时有阵雨。至下午六时半，空中发现长虹，呈红黄"}, {"date": "1927-07-03", "page": "885", "kw": "县志", "phase": "志事往来", "principals": [], "snippet": "明补板，与家藏同。并赠《南陵县志》。  拜蒋穀孙谭，交还前假朱淑真《诗注后集》八卷。元板仅存卷一之四十五、四"}, {"date": "1927-07-15", "page": "887-888", "kw": "志书", "phase": "志事往来", "principals": ["杨芷青"], "snippet": "隆晚餐。  杨芷青来函，收到志书余款，并告南陵水灾。"}, {"date": "1927-08-01", "page": "894-895", "kw": "志书", "phase": "志事往来", "principals": ["吴舜臣"], "snippet": "淑真诗注》。  覆吴舜臣书。志书由八月俞峻韵来取。峻韵回陵放急振。南陵县致安  徽义振会乞振函寄还。"}, {"date": "1927-09-23", "page": "905", "kw": "县志", "phase": "纂修·采访", "principals": [], "snippet": "是李桓于元至正曾任南陵主簿，县志职官未列，书此备考。"}, {"date": "1927-10-07", "page": "907-908", "kw": "县志", "phase": "志事往来", "principals": [], "snippet": "片，借阅书样，录文二篇，备补县志之遗：县志误顺天 ", "page": "1018-1019", "kw": "志书", "phase": "分发·结账", "principals": ["吴舜臣"], "snippet": "人，南陵有俞则贤。峻韵来沪运志书，及印民国志，恐不能  成事实。振务借款收到若干，运芜若干。  覆李从龙书。"}, {"date": "1928-12-28", "page": "1019-1020", "kw": "县志", "phase": "志事往来", "principals": [], "snippet": "俞峻韵由南陵来谭，拟运回县志，赠茶叶、二包。黑芝麻、一袋。蜜枣、二包。板鸭，四支。又送孙守道洋十元、糕二"}, {"date": "1929-03-13", "page": "1041-1124", "kw": "县志", "phase": "礼聘·受任", "principals": [], "snippet": "为吾邑人,仕山东清吏司主事,县志文苑有传。吾邑人著述,明刻本大都题宛陵。《川沙厅志》十六卷。俞榘总纂,光绪五"}, {"date": "1929-12-13", "page": "1111", "kw": "县志", "phase": "分发·结账", "principals": [], "snippet": "卿来谭。  南陵县刘之驹函索县志。名片：安徽省任用县建设局长、南陵县建设委员。  南陵县张庆萱祖为余寄父葆慈"}, {"date": "1930-01-21", "page": "1123-1124", "kw": "县志", "phase": "礼聘·受任", "principals": [], "snippet": "为吾邑人,仕山东清吏司主事,县志文苑有传。吾邑人著述,刻本大都题宛陵。《川沙厅志》十六卷。俞越总纂,光绪五年"}, {"date": "1930-02-18", "page": "1130", "kw": "县志", "phase": "分发·结账", "principals": [], "snippet": "南陵县政府章世嘉函索《南陵县志》。"}, {"date": "1930-03-05", "page": "1133", "kw": "县志", "phase": "志事往来", "principals": [], "snippet": "机，拟先回南陵，约下月初来运县志，随邀往功德林午餐。餐毕，同访丁仲枯。  至中国书店，取四月廿九日付讫。《鸿"}, {"date": "1930-03-06", "page": "1133-1134", "kw": "县志", "phase": "刊印·校样", "principals": ["杨芷青", "吴舜臣"], "snippet": "寄南陵。  覆章啸斋县长书。县志向年由志局俞峻韵、杨芷青、刘达章到沪付印今峻韵来运书回陵，已属其径呈。  陈"}, {"date": "1930-03-11", "page": "1135", "kw": "志书", "phase": "刊印·校样", "principals": ["吴舜臣"], "snippet": "。圩工借款已筹还二千元应急。志书因俞峻韵送外甥病人回南,难以兼顾,现招商船不能装货,又以未带运费,且芜湖至南"}, {"date": "1930-03-18", "page": "1137", "kw": "县志", "phase": "志事往来", "principals": [], "snippet": "城金励序、万历丁丑梅守德序。县志据《郑堂读书记》，未见其书。  至王秀仁，取金石拓本五十二种：四月廿九日付。"}, {"date": "1930-03-23", "page": "1138-1137", "kw": "县志", "phase": "志事往来", "principals": ["吴舜臣"], "snippet": "致俞峻韵书。请运回《南陵县志》。  林洞省为翼民娶妇，送绸幢礼券、十元。花、烛、爆。"}, {"date": "1930-03-31", "page": "1141", "kw": "县志", "phase": "志事往来", "principals": ["吴舜臣"], "snippet": "转致立翁，并无异言。寄《南陵县志》五部，计赠县政府二部，张庆萱、刘之驹各一部，又舜臣一部，书由我处付价。送朱"}, {"date": "1930-04-03", "page": "1142", "kw": "县志", "phase": "志事往来", "principals": [], "snippet": "喜。  致王富晋书。寄《南陵县志》。  覆汪甘卿书。十一日至苏。
